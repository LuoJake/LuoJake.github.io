quotes:
  - text: 想得到高于平均的结果，就要在学习、纪律和耐心上长期做出高于平均的投入。
    author: 每日自省
    theme: 个人成长
  - text: 财务自由不是停止创造，而是获得选择如何使用时间的权利。
    author: 每日自省
    theme: 财务自由
  - text: 反人性不是否定感受，而是不让短期冲动替长期目标做决定。
    author: 每日自省
    theme: 投资纪律
  - text: 市场越喧闹，越要回到事实、价格与价值。
    author: 每日自省
    theme: 投资纪律
  - text: 今天少一次无意义的消费，是在为未来多保留一份选择权。
    author: 每日自省
    theme: 财务自由
  - text: 真正拉开差距的，通常不是偶尔拼尽全力，而是把正确的小事重复很多年。
    author: 每日自省
    theme: 长期主义
  - text: 别只问怎样成功，也要列出哪些习惯正在稳定地把自己带向失败。
    author: 每日自省
    theme: 逆向思考
  - text: 能力圈可以慢慢扩大，但边界必须始终诚实。
    author: 每日自省
    theme: 逆向思考
  - text: 克制不是错过机会，而是把资本留给真正理解且赔率合适的机会。
    author: 每日自省
    theme: 投资纪律
  - text: 每一次储蓄都在缩短“必须工作”和“可以选择工作”之间的距离。
    author: 每日自省
    theme: 财务自由
  - text: 不用和所有人比较，只需确认今天的行动配得上自己的长期目标。
    author: 每日自省
    theme: 个人成长
  - text: 价格是你付出的，价值是你得到的。
    author: 沃伦·巴菲特
    theme: 投资纪律
    sourceId: warren-buffett
  - text: 最好的持有期限可以很长，但前提是最初的判断仍然成立。
    author: 据巴菲特思想整理
    theme: 长期主义
  - text: 在别人急于行动时保持耐心，在自己急于证明时重新检查事实。
    author: 每日自省
    theme: 投资纪律
  - text: 努力的价值不只在于时长，更在于是否持续投入最重要、最困难的事情。
    author: 每日自省
    theme: 个人成长
  - text: 复利需要时间，时间需要纪律，纪律需要一个足够清楚的长期目标。
    author: 每日自省
    theme: 长期主义
  - text: 每天结束时，都努力让自己比早晨更聪明一点。
    author: 查理·芒格（意译）
    theme: 个人成长
    sourceId: charlie-munger
  - text: 获得智慧是一种责任，学习不应在离开学校时停止。
    author: 据查理·芒格思想整理
    theme: 个人成长
    sourceId: charlie-munger
